<title>Merge Mansion Dialogue Codex</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1F4F0; --surface:#FFFFFF; --surface-2:#E7ECE8; --line:#CFD8D2;
  --ink:#1B211E; --muted:#5C6963; --faint:#8A968F;
  --accent:#2E6B4E; --accent-ink:#FFFFFF; --accent-soft:#DDEBE3;
  --amber:#9A6B12; --amber-soft:#F3E7CB; --brick:#9E3A2C; --brick-soft:#F4DCD7;
  --sel:#2E6B4E22;
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --mono:"Courier Prime","Courier New",Courier,monospace;
  --sans:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151A17; --surface:#1D2420; --surface-2:#242D28; --line:#34403A;
    --ink:#E6ECE8; --muted:#9BA8A1; --faint:#6E7B74;
    --accent:#6FC197; --accent-ink:#0F1A14; --accent-soft:#1F3A2C;
    --amber:#E1B45C; --amber-soft:#3A2F14; --brick:#E4796A; --brick-soft:#3E1F1A;
    --sel:#6FC19733;
  }
}
:root[data-theme="dark"]{
  --ground:#151A17; --surface:#1D2420; --surface-2:#242D28; --line:#34403A;
  --ink:#E6ECE8; --muted:#9BA8A1; --faint:#6E7B74;
  --accent:#6FC197; --accent-ink:#0F1A14; --accent-soft:#1F3A2C;
  --amber:#E1B45C; --amber-soft:#3A2F14; --brick:#E4796A; --brick-soft:#3E1F1A;
  --sel:#6FC19733;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:22px;padding:14px 22px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-family:var(--serif);font-weight:400;font-size:22px;margin:0;letter-spacing:.01em}
header h1 em{font-style:italic;color:var(--accent)}
.stats{display:flex;gap:18px;margin-left:auto;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.stat b{font-size:17px;font-weight:600}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat.warn b{color:var(--amber)} .stat.bad b{color:var(--brick)}

aside{border-right:1px solid var(--line);background:var(--surface);padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:6px}
.fld input,.fld select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--ground);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--ground);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:inherit;opacity:.8}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;line-height:1.5}
.note code{font-family:var(--mono);font-size:11.5px}

main{overflow:auto;padding:18px 26px 60px}
.resultbar{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;color:var(--muted);font-size:12.5px}
.resultbar b{color:var(--ink);font-variant-numeric:tabular-nums}
.story{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;max-width:920px}
.story.removed{border-color:var(--brick);border-style:dashed}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;padding:12px 18px 10px;border-bottom:1px solid var(--line)}
.shead h2{font-family:var(--serif);font-size:16.5px;font-weight:400;margin:0;text-wrap:balance}
.sid{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:auto}
.trig{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 8px;border-radius:3px;background:var(--surface-2);color:var(--muted)}
.trig b{color:var(--ink);font-weight:500}
.trig.area{background:var(--accent-soft);color:var(--accent)} .trig.area b{color:var(--accent)}
.trig.unknown{background:var(--amber-soft);color:var(--amber)} .trig.unknown b{color:var(--amber)}
.trig.removed{background:var(--brick-soft);color:var(--brick)} .trig.removed b{color:var(--brick)}
.trig.chrono{font-variant-numeric:tabular-nums;cursor:help}
.ver{font-family:var(--mono);font-size:11px;color:var(--faint)}
.script{padding:12px 18px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.5}
.ln{display:grid;grid-template-columns:150px 1fr;gap:0 14px;padding:3px 0;align-items:baseline}
.ln .who{text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .who small{display:block;font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint);font-size:11px}
.ln .txt{max-width:66ch}
.ln.empty .txt{color:var(--faint);font-style:italic}
.ln.narr .who{color:var(--faint);font-weight:400}
.ln .chg{display:block;color:var(--amber);font-size:12px;margin-top:2px}
.ln .chg s{color:var(--faint)}
.mark{background:var(--sel);border-radius:2px}
.more{display:block;margin:10px auto 0;padding:8px 18px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer}
.more:hover{border-color:var(--accent)}
.empty{color:var(--muted);padding:30px 0}
h3.sect{font-family:var(--serif);font-weight:400;font-size:18px;margin:26px 0 10px;color:var(--brick)}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}.ln{grid-template-columns:1fr}.ln .who{white-space:normal}}
@media (prefers-reduced-motion:no-preference){.chip,.more{transition:background .12s,border-color .12s}}
</style>

<div class="app">
  <header>
    <h1>Merge Mansion <em>Dialogue Codex</em></h1>
    <div class="stats" id="stats"></div>
  </header>
  <aside>
    <div class="fld"><label for="q">Search text, speaker, story id, area, event</label><input id="q" type="search" placeholder="e.g. Grandma bail, Pool House, CBE_Easter…" autocomplete="off"></div>
    <div class="fld"><label>Source of the dialogue</label><div class="chips" id="kinds"></div></div>
    <div class="fld"><label for="char">Character speaking</label><select id="char"><option value="">Any character</option></select>
      <div class="chips" style="margin-top:6px"><button type="button" class="chip on" id="charSortLines">by lines</button><button type="button" class="chip" id="charSortAz">A–Z</button></div></div>
    <div class="fld"><label for="scope">Area or event</label><select id="scope"><option value="">Anywhere</option></select></div>
    <label class="toggle"><input type="checkbox" id="onlyChanged"> Only lines whose text was rewritten between game versions</label>
    <label class="toggle"><input type="checkbox" id="showCosmetic"> Also show cosmetic edits (typos, punctuation, markup)</label>
    <label class="toggle"><input type="checkbox" id="showEmpty" checked> Show silent lines (no text, camera/animation beats)</label>
    <label class="toggle"><input type="checkbox" id="showRemoved" checked> Include stories removed from the game since 26.02.01</label>
    <div class="note" id="legend"></div>
  </aside>
  <main>
    <div class="resultbar" id="resultbar"></div>
    <div id="list"></div>
  </main>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const S = D.summary;
  const KIND_LABEL = {area:'Area task', event:'Event moment', item:'Item discovered', decoration:'Decoration placed', chained:'Follows another dialogue', unknown:'No known trigger yet', removed:'Removed from game'};
  const KIND_ORDER = ['area','event','item','decoration','chained','unknown','removed'];

  // ---- stats strip
  const st = document.getElementById('stats');
  const stat = (b, s, cls) => `<div class="stat ${cls||''}"><b>${b.toLocaleString('en-US')}</b><span>${s}</span></div>`;
  st.innerHTML = stat(S.lines,'lines · '+S.version) + stat(S.stories,'stories') + stat(S.characters,'speaking characters')
    + stat(S.unmatchedGroups,'stories without a known trigger','warn') + stat(S.removedStories,'stories removed since '+S.historyVersions[0],'bad');

  // ---- indexes
  const removed = D.removedStories.map(r => ({id:r.id, triggers:[{kind:'removed', lastSeen:r.lastSeen}].concat(r.triggers||[]), lines:r.lines, removedStory:true, firstSeen:null}));
  const all = D.stories.concat(removed);
  all.forEach(s => {
    s.kind = s.triggers[0].kind;
    s.hay = (s.id+' '+s.lines.map(l=>(l.speakerName||'')+' '+l.text).join(' ')+' '+s.triggers.map(t=>[t.area,t.task,t.event,t.eventType,t.items&&t.items.join(' '),t.decoration].filter(Boolean).join(' ')).join(' ')).toLowerCase();
    s.scopes = new Set(); s.triggers.forEach(t => { if (t.area) s.scopes.add('A:'+t.area); if (t.event) s.scopes.add('E:'+t.event); });
    if (s.unassigned) s.scopes.add('U:'+s.unassigned);
    s.chars = new Set(s.lines.map(l=>l.speaker).filter(Boolean));
    s.hasRewrite = s.lines.some(l => (l.changes||[]).some(c => c.kind !== 'cosmetic'));
    s.hasChange = s.lines.some(l => l.changes && l.changes.length);
  });
  const kindCount = {}; all.forEach(s => kindCount[s.kind] = (kindCount[s.kind]||0)+1);
  const kinds = document.getElementById('kinds');
  const active = new Set(KIND_ORDER);
  KIND_ORDER.forEach(k => {
    if (!kindCount[k]) return;
    const el = document.createElement('button'); el.className='chip on'; el.type='button';
    el.innerHTML = `${KIND_LABEL[k]} <small>${kindCount[k].toLocaleString('en-US')}</small>`;
    el.onclick = () => { if (active.has(k)) active.delete(k); else active.add(k); el.classList.toggle('on', active.has(k)); render(); };
    kinds.appendChild(el);
  });
  // characters: only those that actually speak in a story of this page; sortable by line count or name
  // Characters cascade with the area/event filter: only those who speak in the selected scope, with counts inside it.
  const charSel = document.getElementById('char');
  let charMode = 'lines';
  function fillChars(mode) {
    if (mode) charMode = mode;
    const keep = charSel.value;
    const sc = document.getElementById('scope').value;
    const withRemoved = document.getElementById('showRemoved').checked;
    const inScope = all.filter(s => (!sc || s.scopes.has(sc)) && (withRemoved || !s.removedStory));
    const lines = {}, stories = {};
    inScope.forEach(s => {
      const seen = new Set();
      s.lines.forEach(l => { if (l.speaker) { lines[l.speaker] = (lines[l.speaker] || 0) + 1; seen.add(l.speaker); } });
      seen.forEach(c => stories[c] = (stories[c] || 0) + 1);
    });
    const list = D.characters.filter(c => lines[c.id]).map(c => ({ id: c.id, name: c.name, lines: lines[c.id], stories: stories[c.id] }));
    list.sort(charMode === 'az' ? (a, b) => a.name.localeCompare(b.name, 'en') : (a, b) => b.lines - a.lines);
    charSel.innerHTML = '<option value="">Any character</option>';
    list.forEach(c => { const o=document.createElement('option'); o.value=c.id; o.textContent=`${c.name} — ${c.lines.toLocaleString('en-US')} lines, ${c.stories} stories`; charSel.appendChild(o); });
    charSel.value = list.some(c => c.id === keep) ? keep : '';
    document.getElementById('charSortLines').classList.toggle('on', charMode !== 'az');
    document.getElementById('charSortAz').classList.toggle('on', charMode === 'az');
  }
  document.getElementById('charSortLines').onclick = () => fillChars('lines');
  document.getElementById('charSortAz').onclick = () => fillChars('az');
  // areas in game progression order (wiki orderingIndex from Module:Datatable/Areas/Mapping), unknown ones last
  const scopeSel = document.getElementById('scope');
  const scopeCount = {}; all.forEach(s => s.scopes.forEach(sc => scopeCount[sc]=(scopeCount[sc]||0)+1));
  const order = D.areaOrder || {};
  const areaKey = k => [order[k.slice(2)] === undefined ? 1e6 : order[k.slice(2)], k];
  const areas = Object.keys(scopeCount).filter(k=>k.startsWith('A:')).sort((a, b) => { const [x, y] = [areaKey(a), areaKey(b)]; return x[0] - y[0] || x[1].localeCompare(y[1]); });
  const evs = Object.keys(scopeCount).filter(k=>k.startsWith('E:')).sort();
  const og1=document.createElement('optgroup'); og1.label='Areas (progression order)';
  areas.forEach(k=>{const o=document.createElement('option');o.value=k;const idx=order[k.slice(2)];o.textContent=`${idx===undefined?'':'#'+Math.round(idx)+' '}${k.slice(2)} (${scopeCount[k]})`;og1.appendChild(o);});
  const og2=document.createElement('optgroup'); og2.label='Events'; evs.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=`${k.slice(2)} (${scopeCount[k]})`;og2.appendChild(o);});
  const uns = Object.keys(scopeCount).filter(k=>k.startsWith('U:')).sort((a,b)=>scopeCount[b]-scopeCount[a]||a.localeCompare(b));
  const og3=document.createElement('optgroup'); og3.label=`Unassigned — needs your call (${uns.reduce((n,k)=>n+scopeCount[k],0)} stories)`;
  uns.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=`${k.slice(2)}… (${scopeCount[k]})`;og3.appendChild(o);});
  scopeSel.appendChild(og1); scopeSel.appendChild(og2); scopeSel.appendChild(og3);

  document.getElementById('legend').innerHTML =
    `History covers dumps <code>${S.historyVersions[0]}</code> → <code>${S.historyVersions[S.historyVersions.length-1]}</code> (${S.historyVersions.length} versions). ` +
    `A version tag on a story is the first dump it appears in; lines with a changed text show the previous wording struck through. ` +
    `Data: dialogues.json + areas.json + events.json of each dump, nothing hand-edited. With an area or event selected, stories are sorted by chronology (⏱ position on the progress axis; hover for the evidence).`;

  // ---- render
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const hl = (text, q) => { if (!q) return esc(text); const i = text.toLowerCase().indexOf(q); if (i<0) return esc(text); return esc(text.slice(0,i))+'<span class="mark">'+esc(text.slice(i,i+q.length))+'</span>'+esc(text.slice(i+q.length)); };
  const trig = t => {
    if (t.kind==='area') return `<span class="trig area">${esc(t.area)} · <b>${esc(t.task||'?')}</b> · ${esc(t.phase)}</span>`;
    if (t.kind==='event') return `<span class="trig"><b>${esc(t.event||t.eventId)}</b> · ${esc(t.eventType)} · ${esc(t.moment)}</span>`;
    if (t.kind==='item') return `<span class="trig"><b>${esc(t.event)}</b> · item discovered: ${esc((t.items||[]).join(', ')||'?')}</span>`;
    if (t.kind==='decoration') return `<span class="trig"><b>${esc(t.event)}</b> · decoration ${esc(t.decoration||'?')}</span>`;
    if (t.kind==='chained') return `<span class="trig">follows <b>${esc(t.after)}</b> · ${esc(t.area)} · ${esc(t.task||'')}</span>`;
    if (t.kind==='removed') return `<span class="trig removed">last seen in <b>${esc(t.lastSeen)}</b></span>`;
    return `<span class="trig unknown">no trigger found · <b>${esc(t.hint)}</b></span>`;
  };
  const title = s => {
    const t = s.triggers[0];
    if (t.kind==='area') return `${t.area}: ${t.task||s.id}`;
    if (t.kind==='event') return `${t.event||t.eventId} — ${t.moment}`;
    if (t.kind==='item') return `${t.event} — ${(t.items||[]).join(', ')||s.id}`;
    if (t.kind==='decoration') return `${t.event} — ${t.decoration||s.id}`;
    return s.id.replace(/_/g,' ');
  };
  const list = document.getElementById('list'), bar = document.getElementById('resultbar');
  const PAGE = 60;
  let shown = PAGE, current = [];
  function storyHtml(s, q, showEmpty, onlyChanged, showCosmetic) {
    const visChanges = l => (l.changes||[]).filter(c => showCosmetic || c.kind !== 'cosmetic');
    const lines = s.lines.filter(l => (showEmpty || l.text) && (!onlyChanged || visChanges(l).length));
    const body = lines.map(l => {
      const who = l.speaker ? `${esc(l.speakerName||l.speaker)}${l.state&&l.state!=='Default'?`<small>${esc(l.state)}</small>`:''}` : `<small>${l.text?'narration / no speaker':'beat'}</small>`;
      const chg = visChanges(l).map(c => `<span class="chg">${esc(c.version)}${c.kind==='cosmetic'?' (cosmetic)':''}: <s>${esc(c.from||'∅')}</s></span>`).join('');
      return `<div class="ln ${l.text?'':'empty'} ${l.speaker?'':'narr'}"><div class="who">${who}</div><div class="txt">${l.text?hl(l.text,q):esc(l.id)}${chg}</div></div>`;
    }).join('');
    const ver = s.removedStory ? '' : (s.firstSeen ? `<span class="ver">since ${esc(s.firstSeen)}</span>` : '');
    const chrono = s.chrono ? `<span class="trig chrono" title="${esc(s.chrono.evidence)} (${esc(s.chrono.version)})">⏱ ${Math.round(s.chrono.pos*100)} % · ${esc(s.chrono.phase)}</span>` : '';
    return `<article class="story ${s.removedStory?'removed':''}"><div class="shead"><h2>${hl(title(s),q)}</h2>${s.triggers.map(trig).join('')}${chrono}${ver}<span class="sid">${esc(s.id)}</span></div><div class="script">${body||'<div class="empty">Referenced by the game, but no lines matched this id.</div>'}</div></article>`;
  }
  function render(reset) {
    if (reset!==false) shown = PAGE;
    const q = document.getElementById('q').value.trim().toLowerCase();
    const ch = charSel.value, sc = scopeSel.value;
    const onlyChanged = document.getElementById('onlyChanged').checked, showEmpty = document.getElementById('showEmpty').checked, showRemoved = document.getElementById('showRemoved').checked, showCosmetic = document.getElementById('showCosmetic').checked;
    current = all.filter(s => active.has(s.kind) && (showRemoved || !s.removedStory) && (!ch || s.chars.has(ch)) && (!sc || s.scopes.has(sc)) && (!onlyChanged || (showCosmetic ? s.hasChange : s.hasRewrite)) && (!q || s.hay.includes(q)));
    if (sc) current.sort((a, b) => ((a.chrono ? a.chrono.pos : 2) - (b.chrono ? b.chrono.pos : 2)) || a.id.localeCompare(b.id));
    const nLines = current.reduce((a,s)=>a+s.lines.filter(l=>l.text).length,0);
    bar.innerHTML = `<b>${current.length.toLocaleString('en-US')}</b> stories · <b>${nLines.toLocaleString('en-US')}</b> spoken lines${q?` · matching “${esc(q)}”`:''}`;
    list.innerHTML = current.slice(0, shown).map(s => storyHtml(s, q, showEmpty, onlyChanged, showCosmetic)).join('') || '<div class="empty">Nothing matches these filters.</div>';
    if (current.length > shown) { const b=document.createElement('button'); b.className='more'; b.textContent=`Show ${Math.min(PAGE,current.length-shown)} more of ${(current.length-shown).toLocaleString('en-US')} remaining`; b.onclick=()=>{shown+=PAGE;render(false);}; list.appendChild(b); }
  }
  let t; document.getElementById('q').addEventListener('input', () => { clearTimeout(t); t=setTimeout(render,180); });
  ['char','onlyChanged','showEmpty','showCosmetic'].forEach(id => document.getElementById(id).addEventListener('change', () => render()));
  ['scope','showRemoved'].forEach(id => document.getElementById(id).addEventListener('change', () => { fillChars(); render(); }));
  fillChars();
  render();
})();
</script>
